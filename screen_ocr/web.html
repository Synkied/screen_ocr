<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Screen OCR History</title>
<style>
  :root {
    --bg: #f6f7f9; --panel: #fff; --text: #1d2330; --muted: #6b7384;
    --border: #e1e4ea; --accent: #0a84d6; --danger: #d33a3a; --chip: #eef1f5;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #15181e; --panel: #1d2129; --text: #e6e8ec; --muted: #9098a8;
      --border: #2c313b; --accent: #4cc2ff; --danger: #ff6b6b; --chip: #262b35;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text);
         font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  button, input { font: inherit; color: inherit; }
  button { background: var(--chip); border: 1px solid var(--border); border-radius: 6px;
           padding: 4px 10px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.danger { color: var(--danger); }
  button:disabled { opacity: .5; cursor: default; }
  input[type=text], input[type=search] { background: var(--panel); border: 1px solid var(--border);
           border-radius: 6px; padding: 5px 9px; }

  .layout { display: grid; grid-template-columns: 200px 1fr; min-height: 100vh; }
  aside { border-right: 1px solid var(--border); padding: 16px 10px; background: var(--panel); }
  aside h1 { font-size: 15px; margin: 0 6px 14px; }
  aside a { display: flex; justify-content: space-between; padding: 5px 8px; border-radius: 6px;
            color: var(--text); text-decoration: none; }
  aside a:hover { background: var(--chip); }
  aside a.active { background: var(--accent); color: #fff; }
  aside a span { opacity: .7; }

  main { padding: 16px 20px; max-width: 980px; }
  .toolbar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; position: sticky;
             top: 0; background: var(--bg); padding: 6px 0 12px; z-index: 1; }
  .toolbar input[type=search] { flex: 1; min-width: 180px; }
  .count { color: var(--muted); margin-left: auto; }

  .card { background: var(--panel); border: 1px solid var(--border); border-radius: 10px;
          padding: 10px 12px; margin-bottom: 10px; display: grid;
          grid-template-columns: auto 1fr; gap: 4px 10px; }
  .card.selected { border-color: var(--accent); }
  .card header { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .card time { color: var(--muted); font-size: 12px; }
  .card .cat { width: 120px; padding: 2px 8px; font-size: 12px; }
  .card .actions { margin-left: auto; display: flex; gap: 6px; }
  .card .actions button { padding: 2px 8px; font-size: 12px; }
  .card pre { grid-column: 2; margin: 4px 0 0; white-space: pre-wrap; word-break: break-word;
              font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; max-height: 16em;
              overflow: auto; }
  .card img { grid-column: 2; max-width: 100%; max-height: 90px; border-radius: 6px;
              border: 1px solid var(--border); cursor: zoom-in; justify-self: start; }
  .card img.big { max-height: none; cursor: zoom-out; }
  .empty { color: var(--muted); text-align: center; padding: 60px 0; }

  @media (max-width: 640px) {
    .layout { grid-template-columns: 1fr; }
    aside { border-right: 0; border-bottom: 1px solid var(--border); display: flex;
            flex-wrap: wrap; gap: 4px; align-items: center; }
    aside h1 { width: 100%; }
    main { padding: 12px 16px; }
  }
</style>
</head>
<body>
<div class="layout">
  <aside id="cats"><h1>Screen OCR</h1></aside>
  <main>
    <div class="toolbar">
      <input type="checkbox" id="all" title="Select all">
      <input type="search" id="q" placeholder="Search text…">
      <input type="text" id="bulkcat" list="catlist" placeholder="Category…" size="12">
      <button id="bulkset" disabled>Set category</button>
      <button id="bulkdel" class="danger" disabled>Delete</button>
      <span class="count" id="count"></span>
    </div>
    <div id="list"></div>
  </main>
</div>
<datalist id="catlist"></datalist>

<script>
const state = { category: null, q: "", captures: [], selected: new Set() };
const $ = (id) => document.getElementById(id);

async function api(method, path, body) {
  const res = await fetch(path, {
    method,
    headers: body ? { "Content-Type": "application/json" } : {},
    body: body ? JSON.stringify(body) : undefined,
  });
  if (!res.ok) throw new Error((await res.json()).error || res.statusText);
  return res.json();
}

async function load() {
  const params = new URLSearchParams();
  if (state.q) params.set("q", state.q);
  if (state.category !== null) params.set("category", state.category);
  const data = await api("GET", "/api/captures?" + params);
  state.captures = data.captures;
  const ids = new Set(data.captures.map((c) => c.id));
  state.selected = new Set([...state.selected].filter((id) => ids.has(id)));
  renderCategories(data.categories);
  renderList();
}

function renderCategories(cats) {
  const aside = $("cats");
  aside.querySelectorAll("a").forEach((a) => a.remove());
  const total = cats.reduce((n, c) => n + c.n, 0);
  const link = (label, value, n) => {
    const a = document.createElement("a");
    a.href = "#";
    a.className = state.category === value ? "active" : "";
    a.append(label);
    const s = document.createElement("span");
    s.textContent = n;
    a.append(s);
    a.onclick = (e) => { e.preventDefault(); state.category = value; load(); };
    aside.append(a);
  };
  link("All", null, total);
  cats.forEach((c) => link(c.category || "(none)", c.category, c.n));

  const dl = $("catlist");
  dl.replaceChildren(...cats.filter((c) => c.category).map((c) => {
    const o = document.createElement("option");
    o.value = c.category;
    return o;
  }));
}

function renderList() {
  const list = $("list");
  list.replaceChildren();
  if (!state.captures.length) {
    list.innerHTML = '<div class="empty">No captures yet. Press your hotkey and drag a box.</div>';
  }
  for (const c of state.captures) list.append(card(c));
  $("count").textContent = `${state.captures.length} shown`;
  $("all").checked = state.captures.length > 0 && state.selected.size === state.captures.length;
  $("bulkdel").disabled = $("bulkset").disabled = state.selected.size === 0;
  $("bulkdel").textContent = state.selected.size ? `Delete ${state.selected.size}` : "Delete";
}

function card(c) {
  const el = document.createElement("div");
  el.className = "card" + (state.selected.has(c.id) ? " selected" : "");

  const check = document.createElement("input");
  check.type = "checkbox";
  check.checked = state.selected.has(c.id);
  check.onchange = () => {
    check.checked ? state.selected.add(c.id) : state.selected.delete(c.id);
    renderList();
  };

  const header = document.createElement("header");
  const time = document.createElement("time");
  time.textContent = new Date(c.created_at * 1000).toLocaleString();

  const cat = document.createElement("input");
  cat.type = "text";
  cat.className = "cat";
  cat.value = c.category;
  cat.placeholder = "category";
  cat.setAttribute("list", "catlist");
  cat.onchange = async () => {
    await api("PATCH", `/api/captures/${c.id}`, { category: cat.value });
    load();
  };

  const actions = document.createElement("div");
  actions.className = "actions";
  const copy = document.createElement("button");
  copy.textContent = "Copy";
  copy.onclick = async () => {
    await navigator.clipboard.writeText(c.text);
    copy.textContent = "Copied";
    setTimeout(() => (copy.textContent = "Copy"), 1200);
  };
  const del = document.createElement("button");
  del.className = "danger";
  del.textContent = "Delete";
  del.onclick = () => remove([c.id]);
  actions.append(copy, del);
  header.append(time, cat, actions);

  const pre = document.createElement("pre");
  pre.textContent = c.text;

  el.append(check, header, document.createElement("span"), pre);
  if (c.image) {
    const img = document.createElement("img");
    img.src = `/images/${c.image}`;
    img.loading = "lazy";
    img.alt = "capture";
    img.onclick = () => img.classList.toggle("big");
    el.append(document.createElement("span"), img);
  }
  return el;
}

async function remove(ids) {
  const what = ids.length === 1 ? "this capture" : `${ids.length} captures`;
  if (!confirm(`Delete ${what}? This removes the text and screenshot for good.`)) return;
  await api("POST", "/api/captures/delete", { ids });
  ids.forEach((id) => state.selected.delete(id));
  load();
}

$("all").onchange = (e) => {
  state.selected = e.target.checked ? new Set(state.captures.map((c) => c.id)) : new Set();
  renderList();
};
$("bulkdel").onclick = () => remove([...state.selected]);
$("bulkset").onclick = async () => {
  const category = $("bulkcat").value.trim();
  await Promise.all([...state.selected].map((id) =>
    api("PATCH", `/api/captures/${id}`, { category })));
  load();
};
let timer;
$("q").oninput = (e) => {
  clearTimeout(timer);
  timer = setTimeout(() => { state.q = e.target.value.trim(); load(); }, 200);
};
window.onfocus = load;  // pick up captures made while the tab was in the background
load();
</script>
</body>
</html>
