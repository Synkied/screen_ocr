[project]
name = "screen-ocr"
version = "0.1.0"
description = "Hotkey, drag a box on screen, get the text in your clipboard."
requires-python = ">=3.9"
dependencies = [
    "mss>=9",
    "pillow>=10",
    "pytesseract>=0.3.10",
    "pynput>=1.7.6",
    "pyperclip>=1.8",
]

[project.scripts]
screen-ocr = "screen_ocr.app:main"

[tool.setuptools.package-data]
screen_ocr = ["*.html"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
