[project]
name = "screen-ocr"
version = "0.1.0"
description = "Hotkey, drag a box on screen, get the text in your clipboard."
requires-python = ">=3.9"
# The base install is enough for the history page (`screen-ocr --web`), e.g. on a
# Raspberry Pi. Capturing needs the desktop extra: pip install -e '.[desktop]'
dependencies = [
    "pillow>=10",
    # readings for kanji and hanzi, so 東京 shows and finds as "tokyo", with furigana
    "pykakasi>=2.2",
    "pypinyin>=0.49",
]

[project.optional-dependencies]
desktop = [
    "mss>=9",
    "pytesseract>=0.3.10",
    "pynput>=1.7.6",
    "pyperclip>=1.8",
]

[project.scripts]
screen-ocr = "screen_ocr.app:main"

[tool.setuptools]
packages = ["screen_ocr"]  # contrib/ holds setup files, not code

[tool.setuptools.package-data]
screen_ocr = ["*.html"]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"
